# Optioneel: alleen voor lokale dev-DB. Bij Supabase (DATABASE_URL gezet) wordt deze niet gestart.
services:
  db:
    image: postgres:15-alpine
    container_name: better_wbw_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   # host 5433 om conflict met andere Postgres op 5432 te vermijden
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
